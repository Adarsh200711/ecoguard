spring.application.name=ecoguard
server.port=8080

# ===================================================================
# Primary Database: MySQL (Required for Demo)
# ===================================================================
# Database URL, Username, and Password support environment variables:
#   MYSQL_URL, MYSQL_USER, MYSQL_PASSWORD
# Database name configured to 'ecoguard' per project requirements
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/ecoguard?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration for MySQL (Hibernate auto-detects dialect)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# File Upload Configuration (Permanent Photo Storage)
# ===================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# Static Resources
# ===================================================================
spring.web.resources.static-locations=classpath:/static/
